org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 强制用系统 JDK 21(避免 Gradle 误选 VSCode redhat.java 扩展的残缺 JRE,缺 jlink)
org.gradle.java.home=D:/Home/Programs/Dev/jdk21
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 9 默认内置 Kotlin(builtInKotlin),与 KGP 不兼容且 classpath 异常;
# 关闭后回到传统 KGP 行为,用 org.jetbrains.kotlin.android plugin。
android.builtInKotlin=false
android.newDsl=false
